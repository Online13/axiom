name: Apps

# Typechecks each Expo app, runs the registry tests (packages/registry/tests) on the copied components, and bundles its JavaScript for Android and
# iOS with Metro, so a demo that no longer builds fails here instead of on a device.
on:
  pull_request:
    paths:
      - apps/demo-*/**
      - packages/registry/**
      - packages/cli/**
      - examples/**
      - bun.lock
      - .github/workflows/apps.yml
  push:
    branches: [main]
    paths:
      - apps/demo-*/**
      - packages/registry/**
      - packages/cli/**
      - examples/**
      - bun.lock
      - .github/workflows/apps.yml

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/demo-stylesheet
          - apps/demo-unistyles
          - apps/demo-nativewind
          - apps/demo-uniwind
          - examples/noty
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Registry items are gitignored in the demos: copy the ones axiom.json lists, as a fresh clone would.
      - name: Fetch registry items
        working-directory: ${{ matrix.app }}
        run: bun run axiom sync --no-install

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: bunx tsc --noEmit

      # Component tests render the copied components and drive them like a user, in every styling.
      - name: Test components
        if: startsWith(matrix.app, 'apps/demo-')
        working-directory: ${{ matrix.app }}
        run: bun run test --ci

      - name: Bundle
        working-directory: ${{ matrix.app }}
        run: bunx expo export --platform android --platform ios --output-dir dist
