name: CLI

# Typechecks and tests the CLI whenever it, or the registry it copies from, changes.
on:
  pull_request:
    paths:
      - packages/cli/**
      - packages/registry/**
      - bun.lock
      - .github/workflows/cli.yml
  push:
    branches: [main]
    paths:
      - packages/cli/**
      - packages/registry/**
      - bun.lock
      - .github/workflows/cli.yml

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd packages/cli typecheck

      - name: Test
        run: bun run --cwd packages/cli test
